apiVersion: v2
name: chewy-genai-automation
description: A Helm chart for chewy-genai-automation

# A chart can be either an 'application' or a 'library' chart.
#
# Application charts are a collection of templates that can be packaged into versioned archives
# to be deployed.
#
# Library charts provide useful utilities or functions for the chart developer. They're included as
# a dependency of application charts to inject those utilities and functions into the rendering
# pipeline. Library charts do not define any templates and therefore cannot be deployed.
type: application

# This is the chart version. 
# 
# This version number should be incremented each time you make changes to the chart and its templates, 
# including the app version. Versions are expected to follow Semantic Versioning (https://semver.org/)
# 
# This value generally does not matter unless running the pipeline with the `USE_LOCAL_HELM_CHART` option
version: 0.0.0

# This is the version number of the application being deployed. 
# 
# This version number should be incremented each time you make changes to the application. Versions are 
# expected to follow Semantic Versioning. They should reflect the version the application is using. It 
# is recommended to use it with quotes.
# 
# This value generally does not matter unless running the pipeline with the `USE_LOCAL_HELM_CHART` option
appVersion: "0.0.0"

dependencies:
  - name: chewy-application
    alias: first-app
    repository: https://chewyinc.jfrog.io/artifactory/api/helm/helm-virtual
    version: 2.2.1